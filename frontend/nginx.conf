# Serves the single-page app. /api is NOT handled here: the gateway (local)
# or the Ingress (AKS) routes /api/* straight to the microservices.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed assets never change -> cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Kubernetes probes hit this
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes (/orders/12 etc.) all load index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
