# LOCAL stand-in for the Kubernetes Ingress / Azure Application Gateway.
# Same path-based routing the Ingress will use in AKS (Phase 5):
#   /api/<area>/...  -> the owning microservice
#   everything else  -> frontend
# /actuator and /internal are never routed, so they stay private.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;

    # Docker's internal DNS; resolve per request so the gateway starts even if a service is still booting.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    15s;

    location ~ ^/api/(auth|users)/        { set $up http://user-service:8080;         proxy_pass $up; }
    location ~ ^/api/restaurants          { set $up http://restaurant-service:8080;   proxy_pass $up; }
    location ~ ^/api/menu/                { set $up http://food-service:8080;         proxy_pass $up; }
    location ~ ^/api/cart                 { set $up http://cart-service:8080;         proxy_pass $up; }
    location ~ ^/api/orders               { set $up http://order-service:8080;        proxy_pass $up; }
    location ~ ^/api/payments/            { set $up http://payment-service:8080;      proxy_pass $up; }
    location ~ ^/api/deliveries/          { set $up http://delivery-service:8080;     proxy_pass $up; }
    location ~ ^/api/notifications/       { set $up http://notification-service:8080; proxy_pass $up; }
    location /api/                        { return 404; }

    location / { set $up http://frontend:8080; proxy_pass $up; }
}
